{
  "options": {
    "schedule_splay_percent": "0"
  },
  "schedule": {
    "processes": {
      "query": "SELECT pid,name,path,cmdline,uid FROM processes WHERE cmdline LIKE '%retail-%' OR name='osqueryd';",
      "interval": 5
    },
    "downloads": {
      "query": "SELECT path,uid,mode,size,mtime FROM file WHERE path LIKE '/home/student/lab/downloads/%';",
      "interval": 5
    },
    "config_integrity": {
      "query": "SELECT f.path,f.mode,f.uid,h.sha256 FROM file f JOIN hash h ON f.path=h.path WHERE f.path='/home/student/lab/controller.conf';",
      "interval": 5
    },
    "inventory": {
      "query": "SELECT hostname,cpu_type,physical_memory FROM system_info;",
      "interval": 30,
      "snapshot": true
    },
    "listeners": {
      "query": "SELECT pid,port,address,protocol FROM listening_ports;",
      "interval": 15
    }
  }
}
